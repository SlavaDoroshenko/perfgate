[project]
name = "perfgate-analysis"
version = "0.1.0"
description = "Noise and minimum detectable effect analysis for perfgate measurements"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perfgate_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
