name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: next generates next-env.d.ts that the ssr typecheck needs
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test
      - name: JSON Schema is up to date
        run: |
          pnpm schema
          git diff --exit-code schema/

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v7
      # no moving major tag published for v10
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run pytest
