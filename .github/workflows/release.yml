# Release on a version tag: the x86-64 measurement image to GitHub Container Registry
# (ghcr.io/slavadoroshenko/perfgate:<version> and :latest) after a pinned-browser and
# A/A smoke check, then a GitHub release whose notes are the tag's CHANGELOG section.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: perfgate:release
      - name: Pinned browser and a same-page check inside the image
        run: |
          docker run --rm --entrypoint cat perfgate:release /opt/perfgate/chrome-version.txt | grep -F 153.0.8010.47
          docker run --rm perfgate:release --help > /dev/null
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/slavadoroshenko/perfgate:${{ github.ref_name }}
            ghcr.io/slavadoroshenko/perfgate:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          # the section under "## <tag without v>" up to the next "## "
          awk -v v="## ${TAG#v}" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\nDocker image: `ghcr.io/slavadoroshenko/perfgate:%s` (`%s`)\n' "$TAG" "$DIGEST" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "${{ github.repository }}" --title "perfgate $TAG" --notes-file notes.md --verify-tag
