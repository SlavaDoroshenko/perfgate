# Pairs of commits of real applications, built from source. The build of somebody
# else's project is the fragile part, so the built output is cached by case and refs:
# a failure to rebuild then shows up as a failed job, not as missing data.
name: oss-commits

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Loads per variant
        default: "20"
  schedule:
    - cron: "47 5 * * *"

permissions:
  contents: write

concurrency:
  group: oss-commits
  cancel-in-progress: false

env:
  CHROME_VERSION: "153.0.8010.47"
  RUNS: ${{ inputs.runs || '20' }}

jobs:
  collect:
    name: ${{ matrix.case }} ${{ matrix.throttling }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [phanpy-exclude-xmldom, phanpy-may-to-june, phanpy-june-to-august, excalidraw-0.17.6-to-0.18.0]
        throttling: [devtools, simulate]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-dependencies: true

      - name: Fingerprint the case
        id: fp
        run: |
          fp=$(python3 -c "
          import hashlib, json
          case = [c for c in json.load(open('oss/cases.json')) if c['id'] == '${{ matrix.case }}'][0]
          print(hashlib.sha256(json.dumps(case, sort_keys=True).encode()).hexdigest()[:12])
          ")
          echo "hash=$fp" >> "$GITHUB_OUTPUT"

      - name: Cache the built pair
        id: pair
        uses: actions/cache@v4
        with:
          path: .oss-dist/${{ matrix.case }}
          # keyed by this case only: editing another case must not force a rebuild here
          key: oss-${{ matrix.case }}-${{ steps.fp.outputs.hash }}

      - name: Build both sides
        if: steps.pair.outputs.cache-hit != 'true'
        run: node scripts/build-commit-pair.mjs --case ${{ matrix.case }}

      - name: Serve
        run: |
          nohup pnpm oss:serve > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:4177/${{ matrix.case }}/before/index.html" > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Collect
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          id="${{ github.run_id }}-${{ github.run_attempt }}-commit-${{ matrix.case }}-${{ matrix.throttling }}"
          app_build=$(python3 -c "import json;c=[x for x in json.load(open('oss/cases.json')) if x['id']=='${{ matrix.case }}'][0];print(c['before'][:6]+'-'+c['after'][:6])")
          pnpm perfgate collect \
            --url "http://127.0.0.1:4177/${{ matrix.case }}/before/index.html" \
            --pr-url "http://127.0.0.1:4177/${{ matrix.case }}/after/index.html" \
            --runs "$RUNS" \
            --mode abab \
            --throttling "${{ matrix.throttling }}" \
            --app "oss-${{ matrix.case }}" \
            --app-build "$app_build" \
            --label commit \
            --experiment "$id" \
            --out "results/$id.jsonl"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runs-commit-${{ matrix.case }}-${{ matrix.throttling }}
          path: results/*.jsonl
          retention-days: 7
          if-no-files-found: warn

  store:
    needs: collect
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: runs-*
          merge-multiple: true
          path: incoming
      - name: Commit to data branch
        run: |
          shopt -s nullglob
          files=(incoming/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "no data"; exit 0; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git switch data
          else
            git switch --orphan data
          fi

          dest="raw/$(date -u +%F)"
          mkdir -p "$dest"
          cp "${files[@]}" "$dest/"
          git add -f raw
          git commit -m "data: oss-commits run ${{ github.run_id }}"

          for i in 1 2 3; do
            git push origin data && exit 0
            git pull --rebase origin data
          done
          exit 1
